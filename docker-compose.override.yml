# Development settings, for your machine only. Docker Compose adds this file
# to docker-compose.yml automatically. The live server uses
# docker-compose.prod.yml instead.
#
#   docker compose run --rm test             run the backend tests
#
# The local passwords below are defaults for convenience. To change them, copy
# .env.example to .env.

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-catalyst}:${POSTGRES_PASSWORD:-catalyst}@db:5432/${POSTGRES_DB:-catalyst}

services:

  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalyst}
      POSTGRES_USER: ${POSTGRES_USER:-catalyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalyst}
    ports:
      # For a database client (DBeaver, pgAdmin). Only reachable from this
      # machine. Change POSTGRES_PORT in .env if 5434 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

  schema:
    environment:
      DATABASE_URL: *database-url
    volumes:
      # Use the code and schema.yaml from this folder, so edits don't need a
      # rebuild. On the live server the image's own copy is used.
      - ./backend/catalyst:/app/catalyst:ro
      - ./datamap:/app/datamap  # data map: rebuilt after each apply (see datamap/README.md)

  importer:
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/catalyst:/app/catalyst:ro
      # The lists of what to import, and where downloads are kept.
      - ./imports:/app/imports

  publish:
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/catalyst:/app/catalyst:ro
      - ./published:/app/published

  # Shows the published dashboards at http://localhost:8080, as the live web
  # server will. It's Caddy (a web server, like nginx), only serving the files
  # in published/ here; HTTPS and the live addresses come later.
  web:
    image: caddy:2.10-alpine
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    ports:
      # Only reachable from this machine. Change WEB_PORT in .env if 8080 is taken.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./published:/srv:ro
    restart: unless-stopped

  # The admin page, at http://localhost:8000/admin. Uses the development
  # image, so it restarts by itself when the code or schema.yaml changes.
  admin:
    build:
      context: ./backend
      target: dev
    image: catchment-catalyst-backend-dev
    command: ["serve", "--reload"]
    environment:
      DATABASE_URL: *database-url
      # Local login: name "admin", password "admin". To use your own, make an
      # entry with `docker compose run --rm admin hash-password <name>` and put
      # it in .env as ADMIN_USERS.
      ADMIN_USERS: ${ADMIN_USERS:-admin:scrypt.643245e515ce89eb9cf1a97340e4bc14.6416f16ac5cb71939110556f96b9252c8e00bd2794e8d1697b86df440ffa6a16}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-local-only-not-secret}
    ports:
      # Only reachable from this machine. Change ADMIN_PORT in .env if 8000 is taken.
      - "127.0.0.1:${ADMIN_PORT:-8000}:8000"
    volumes:
      - ./backend/catalyst:/app/catalyst:ro
      # Uploaded files are kept in imports/raw/<table>/.
      - ./imports:/app/imports

  # Backend tests. Each test run uses its own throwaway database on `db`.
  test:
    build:
      context: ./backend
      target: dev
    image: catchment-catalyst-backend-dev
    profiles: ["tools"]
    entrypoint: ["python", "-m", "pytest"]
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/catalyst:/app/catalyst:ro
      - ./backend/tests:/app/tests:ro
      - ./datamap:/app/datamap:ro  # data map
    depends_on:
      db:
        condition: service_healthy
