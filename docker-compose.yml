# Catchment Catalyst services, shared by every environment.
#
# Each environment adds its own settings on top of this file:
#   your machine      docker-compose.override.yml   loaded automatically
#   the live server   docker-compose.prod.yml       chosen by COMPOSE_FILE in the server's .env
#
# So the commands are the same everywhere:
#   docker compose up -d                     start the database and the admin page
#   docker compose run --rm schema plan      preview database structure changes
#   docker compose run --rm schema apply     apply them
#   docker compose run --rm importer catchments imports/catchments.json
#   docker compose run --rm publish          write the dashboards' pages into published/
# See README.md.

name: catchment-catalyst

services:

  # PostgreSQL with PostGIS (maps and boundaries).
  db:
    image: postgis/postgis:17-3.5
    volumes:
      - db-data:/var/lib/postgresql/data
    # Hide the image's start-up script, which pre-installs PostGIS and some
    # US-only extras. A new database then starts empty and the schema tool
    # installs PostGIS itself, which also works on Azure's managed database
    # if we move there later.
    tmpfs:
      - /docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # The schema tool. Runs on demand only (profile "tools").
  schema:
    build:
      context: ./backend
      target: prod
    image: catchment-catalyst-backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "catalyst.db"]
    command: ["plan"]
    depends_on:
      db:
        condition: service_healthy

  # The importers, which fill the database. Run on demand only (profile "tools").
  importer:
    build:
      context: ./backend
      target: prod
    image: catchment-catalyst-backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "catalyst.importers"]
    command: ["--help"]
    depends_on:
      db:
        condition: service_healthy

  # The publish step: writes every location's dashboard as web pages, into
  # published/. Run on demand only (profile "tools").
  publish:
    build:
      context: ./backend
      target: prod
    image: catchment-catalyst-backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "catalyst.publish"]
    depends_on:
      db:
        condition: service_healthy

  # The admin page: log in, download a table as Excel, upload an edited copy.
  # Also makes logins:  docker compose run --rm admin hash-password <name>
  admin:
    build:
      context: ./backend
      target: prod
    image: catchment-catalyst-backend
    entrypoint: ["python", "-m", "catalyst.admin"]
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
