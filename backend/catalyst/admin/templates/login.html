{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 24px auto;">
  <h1>Log in</h1>
  {% if error %}<p class="problems" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="actions"><button class="button">Log in</button></div>
  </form>
</div>
{% endblock %}
