<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}assets/leaflet/leaflet.css">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ root or './' }}">Catchment Catalyst</a>
  <nav class="tabs" aria-label="Dashboard pages">
    <a href="{{ root or './' }}"{% if not tab %} aria-current="page"{% endif %}>Overview</a>
    {% for folder, name in tabs.items() %}
    <a href="{{ root }}{{ folder }}/{% if catchment %}{{ catchment.id }}/{% endif %}"{% if tab == folder %} aria-current="page"{% endif %}>{{ name }}</a>
    {% endfor %}
  </nav>
  <div class="logo"></div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  {{ location.name }}. Published {{ published }}. Catchment details and outlines contain Environment Agency information
  © Environment Agency and database right.
</footer>
<script src="{{ root }}assets/leaflet/leaflet.js"></script>
<script src="{{ root }}assets/map.js"></script>
<script src="{{ root }}assets/sort.js"></script>
</body>
</html>
