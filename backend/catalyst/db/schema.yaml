      cost_confidence:
        type: text
        example: [medium, medium, medium-high, medium]
        description: Shown after "Cost confidence:"
      notes:
        type: text
        example: [null, null, null, "**Notes:** the £30,000 assumption reflects the average …"]
        description: Shown last, e.g. a note about the assumption

  # ---------------------------------------------------------------------------
  #  About a whole location
  # ---------------------------------------------------------------------------

  location_text:
    title: Location Text
    description: >-
      The hand-written text about a whole location: one row per location. In
      Excel, Alt+Enter starts a new line in a cell. A blank line starts a new
      paragraph. A line starting with - or • is a bullet, and two spaces
      before it put it inside the bullet above. **Words** like that are bold,
      and [words](https://…) is a link; web and email addresses become links
      by themselves. A line starting with ## is a heading, ### a section that
      opens and closes (up to the next ## or ###; the first starts open), ####
      a smaller heading, and > a paragraph in a grey box.
    filled_by: excel
    columns:
      location_id:
        type: integer
        example: [1, 2, 3, 4]
        primary_key: true
        references: locations.id
        description: The location (see the Locations table), e.g. 1 for North Devon
      why_failing:
        type: text
