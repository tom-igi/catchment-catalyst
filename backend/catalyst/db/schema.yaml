# =============================================================================
#  Catchment Catalyst – database schema  (MASTER FILE)
# =============================================================================
#
#  This file lists every table and column in the database. To change the
#  database, edit this file, then from the project folder run:
#
#      docker compose run --rm schema plan      # preview the changes (safe)
#      docker compose run --rm schema apply     # make the changes
#
#  The tool compares this file with the database and works out the changes
#  itself, so no SQL is needed. Changes are all-or-nothing: if any step fails,
#  nothing is changed.
#
#  Changes that would delete data (removing a table or column, or changing a
#  column's type) are refused unless you add --allow-data-loss to `apply`.
#
#  RENAMING: change the name and add `renamed_from: <old name>` to the table
#  or column. Without it, a rename is treated as "delete the old one and add
#  a new empty one". The line is harmless if left in afterwards.
#
#  -----------------------------------------------------------------------------
#  Column options
#  -----------------------------------------------------------------------------
#    type          Required. One of:
#                    text, varchar(N), integer, bigint, smallint,
#                    numeric, numeric(P,S), double, real, boolean,
#                    date, timestamptz, jsonb, uuid,
#                    geometry(<Point | LineString | Polygon | MultiPoint |
#                             MultiLineString | MultiPolygon>, <SRID>)
#                  Add [] for a list of values, e.g. text[] (not for
#                  geometry or jsonb).
#    description   What the column holds. Saved as a comment in the database.
#    required      true = must always have a value. Default: false.
#    primary_key   true = part of the table's primary key (always required).
#    identity      true = numbered automatically (integer primary keys).
#    unique        true = no two rows can have the same value.
#    index         true = add an index for faster lookups. Geometry columns
#                  get a spatial index.
#    default       Value used when none is given. Numbers and true/false are
#                  written as they are. Anything else is SQL, so text needs
#                  inner quotes:  default: "'draft'"   or   default: now()
#    references    other_table.column (a link to a row in another table).
#    on_delete     What happens to this row when the row it references is
#                  deleted: cascade (delete this row too) | set null |
#                  restrict. If left out, the delete is refused.
#    renamed_from  The column's previous name (see RENAMING above).
#    example       An example value, shown on the admin page when the table
#                  is clicked (catalyst/admin/diagram.py). Not stored in the database.
#
#  Table options:  title, description, filled_by, columns, indexes, renamed_from
#    title         Friendly name, e.g. EA Scores. Shown on the admin page.
#    filled_by     How the table gets its data:
#                    api    an importer downloads it from an outside service
#                           (code in backend/catalyst/importers/api/)
#                    excel  uploaded as an Excel file in the admin page. The
#                           table then appears there automatically, with no
#                           code to write. Each upload replaces the table's
#                           rows, so the table needs a primary key, and its
#                           columns can only be text, varchar(N), integer,
#                           bigint, smallint, double, boolean or date.
#                  Leave it out for tables filled some other way (e.g. the
#                  admin page's own records).
#    indexes       Indexes over several columns, for example:
#                    indexes:
#                      - columns: [location_id, year]
#                        unique: true
#
#  -----------------------------------------------------------------------------
#  Two kinds of table
#  -----------------------------------------------------------------------------
#    tables        Core tables: the catchments, the locations and the list of
#                  datasets.
#    data_tables   One table per dataset (EA scores, habitat, livestock, ...).
#                  Every data table must have a required catchment_id column
#                  that references catchments.id, so every row belongs to a
#                  catchment. The catchment ID is the EA WFD waterbody ID.
#                  Data about a whole location (e.g. its text) has a required
#                  location_id column that references locations.id instead.
# =============================================================================

extensions:
  - postgis          # spatial types: boundaries, river lines, points

tables:

  # ---------------------------------------------------------------------------
  #  Core tables
  # ---------------------------------------------------------------------------

  catchments:
    title: Catchments
    description: >-
      Every EA Water Framework Directive (WFD) waterbody catchment. Filled
      entirely from the EA's Catchment Data Explorer by the catchments
      importer, so it is never edited by hand: anything written by hand goes
      in its own table, linked by Catchment ID.
    filled_by: api
    columns:
      id:
        type: text
        example: GB108050008080
        primary_key: true
        description: Catchment ID, which is the EA WFD waterbody ID
      name:
        type: text
        example: West Okement
        required: true
        description: EA name. Names are not unique nationally, so data is always linked by Catchment ID.
      waterbody_type:
        type: text
        example: River
        required: true
        description: River, Lake, Transitional (estuary), Coastal or Groundwater
      river_basin_district_id:
        type: integer
        example: 8
        description: EA ID of the river basin district
      river_basin_district:
        type: text
        example: South West
        description: EA river basin district the catchment is in
      management_catchment_id:
        type: integer
        example: 3062
        index: true
        description: EA ID of the management catchment. Can be used to choose a location's catchments.
      management_catchment:
        type: text
        example: North Devon
        description: EA management catchment name
      operational_catchment_id:
        type: integer
        example: 3468
        description: EA ID of the operational catchment
      operational_catchment:
        type: text
        example: Torridge
        description: EA operational catchment, a smaller grouping within the management catchment
      hydromorphological_designation:
        type: text
        example: not designated artificial or heavily modified
        description: Whether the EA designates the waterbody as artificial or heavily modified
      area_ha:
        type: double
        example: 3174.75
        description: Catchment area in hectares, calculated from the boundary (matches the EA's figure)
      river_length_km:
        type: double
        example: 21.13
        description: River length in kilometres, as shown on the EA's Catchment Data Explorer page
      boundary:
        type: geometry(MultiPolygon, 4326)
        example: "(outline on the map)"
        index: true
        description: >-
          Catchment boundary as latitude/longitude (WGS84). Converted from
          British National Grid on import.
      river_line:
        type: geometry(MultiLineString, 4326)
        example: "(line on the map)"
        description: River line(s) as latitude/longitude (WGS84)
      upstream_ids:
        type: text[]
        example: "(none)"
        description: >-
          Catchment IDs of the waterbodies that flow into this one, from the
          EA. Look their names up in this table.
      downstream_ids:
        type: text[]
        example: GB108050008110
        description: >-
          Catchment IDs of the waterbodies this one flows into, from the EA.
          Look their names up in this table. Some (e.g. estuaries) aren't
          imported yet, so have no row.
      imported_at:
        type: timestamptz
        example: 2026-10-28 09:00
        required: true
        default: now()
        description: When this catchment was last imported from the EA

  locations:
    title: Locations
    description: >-
      One row per dashboard location (e.g. North Devon): its name and the
      catchments it includes. Each location is published as the same
      dashboard, showing only its own catchments. Anything else about a
      location (text, photos, contact details) will go in its own table,
      linked by location ID.
    columns:
      id:
        type: integer
        example: 1
        primary_key: true
        identity: true
        description: Location ID
      name:
        type: text
        example: North Devon
        required: true
        unique: true
        description: Name of the location
      catchment_ids:
        type: text[]
        example: "GB108050008080, GB108050008100, …"
        required: true
        index: true
        description: >-
          Catchment IDs of the catchments in this location. A catchment can be
          in more than one location. Each ID must be in the catchments table:
          whatever saves a location checks this, because the database can't
          check IDs inside a list.

  datasets:
    title: Datasets
    description: >-
      The list of datasets: one row for each data table (the tiles on the
      admin "Choose a table" screen). Holds the text for the dashboard's "i"
      info buttons. The data itself is in each dataset's own table.
    columns:
      id:
        type: integer
        example: 1
        primary_key: true
        identity: true
      table_name:
        type: text
        example: ea_scores
        required: true
        unique: true
        description: The data table this row describes, e.g. ea_scores
      name:
        type: text
        example: EA Scores
        required: true
        description: Name on the admin tile and info button, e.g. EA Scores
      description:
        type: text
        example: Water Framework Directive classification results
      source_organisation:
        type: text
        example: Environment Agency
        description: e.g. Environment Agency, South West Water
      source_url:
        type: text
        example: https://environment.data.gov.uk/catchment-planning
        description: Where the data comes from
      data_date:
        type: date
        example: "2025-10-01"
        description: Date of the data currently loaded
      caveats:
        type: text
        example: 2025 results are provisional
        description: Caveats shown on the info button
      is_national:
        type: boolean
        example: true
        required: true
        default: false
        description: true = one national set for all locations; false = loaded per location
      created_at:
        type: timestamptz
        example: 2026-10-28 09:00
        required: true
        default: now()
      updated_at:
        type: timestamptz
        example: 2026-10-28 09:00
        required: true
        default: now()

  uploads:
    title: Uploads
    description: >-
      One row for each Excel file uploaded in the admin page: which table it
      was for, who uploaded it and when, and what it changed. The file itself
      is kept, so an earlier version of a table can be downloaded from the
      admin page and uploaded again.
    columns:
      id:
        type: integer
        example: 12
        primary_key: true
        identity: true
        description: Upload ID
      table_name:
        type: text
        example: ea_scores
        required: true
        description: The table the file was uploaded to
      file_name:
        type: text
        example: EA scores October.xlsx
        required: true
        description: Name of the file that was uploaded
      stored_as:
        type: text
        example: ea_scores/2026-10-29_143000_12.xlsx
        required: true
        description: Where the file is kept, inside the folder of uploaded and downloaded files
      uploaded_by:
        type: text
        example: tom
        required: true
        description: Who uploaded it (their admin login name)
      uploaded_at:
        type: timestamptz
        example: 2026-10-29 14:30
        required: true
        default: now()
      status:
        type: text
        example: approved
        required: true
        default: "'preview'"
        description: >-
          preview (waiting for someone to check and approve it), approved (the
          table's rows were replaced with the file's) or cancelled
      rows_in_file:
        type: integer
        example: 830
        required: true
      rows_added:
        type: integer
        example: 12
        required: true
        description: Rows in the file that weren't in the table
      rows_changed:
        type: integer
        example: 3
        required: true
        description: Rows in both, with different values
      rows_removed:
        type: integer
        example: 0
        required: true
        description: Rows in the table that weren't in the file, so are deleted
      approved_at:
        type: timestamptz
        example: 2026-10-29 14:32
        description: When it was approved and the table's rows were replaced


data_tables:

  # ---------------------------------------------------------------------------
  #  One table per dataset. Every row has a catchment_id, except in tables
  #  about a whole location, which have a location_id instead.
  # ---------------------------------------------------------------------------

  ea_scores:
    title: EA Scores
    description: >-
      The measured values behind the EA's classifications, shown on the EA
      Data page beside the EA's statuses (e.g. Fish EQR 0.36): one row per
      catchment, measure and year. The measures the page shows are Fish (EQR),
      Inverts NTAXA (EQR), Inverts ASPT (EQR), Macrophytes Sub Element (EQR),
      Phytobenthos Sub Element (EQR), Ammonia (mg/l), Dissolved Oxygen (%),
      Phosphate (mg/l), Temperature (C), pH Lower and pH Upper; any other
      measure goes at the bottom of the page.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      measure:
        type: text
        example: Fish (EQR)
        primary_key: true
        description: The measure, named as on the EA Data page, e.g. Fish (EQR), Phosphate (mg/l), pH Lower
      year:
        type: integer
        example: 2022
        primary_key: true
        description: Classification year, e.g. 2022
      status:
        type: text
        example: Moderate
        description: >-
          The value's status (High, Good, Moderate, Poor or Bad), which colours
          it. Where the EA classifies the item itself (e.g. Fish), the EA's
          status is used instead.
      value:
        type: double
        example: 0.36
        description: The measured value, e.g. Fish EQR 0.36 or phosphate 0.057 mg/l

  habitat_land_use:
    title: Habitat & Land Use
    description: Area of each habitat or land use type in each catchment.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050008080
        primary_key: true
        references: catchments.id
      habitat:
        type: text
        example: Farmland
        primary_key: true
        description: e.g. Farmland, Woodland, Not farmed, Urban
      area_ha:
        type: double
        example: 612
        required: true
        description: Area in hectares
      relative_coverage:
        type: text
        example: High
        description: >-
          How much of this habitat the catchment has compared with others
          (Low, Medium or High). Typed in until the rule for working it out is
          agreed.

  ea_classifications:
    title: EA Classifications
    description: >-
      The EA's Water Framework Directive classification results: the status of
      each classification item (Ecological, Fish, Phosphate, ...) in each
      classification year. Filled from the EA's Catchment Data Explorer by
      `importer classifications`, which replaces every row.
    filled_by: api
    columns:
      catchment_id:
        type: text
        example: GB108050008080
        primary_key: true
        references: catchments.id
      item:
        type: text
        example: Fish
        primary_key: true
        description: The EA's classification item, e.g. Ecological, Fish, Phosphate, Chemical
      year:
        type: integer
        example: 2022
        primary_key: true
        description: Classification year
      cycle:
        type: integer
        example: 3
        primary_key: true
        description: >-
          River basin planning cycle. Some years were classified in two cycles
          (e.g. 2019 in cycles 2 and 3): the dashboard uses the later one.
      level:
        type: text
        example: Element
        description: Where the item sits, e.g. Ecological, chemical or quantitative status, Component, Element, Sub Element
      status:
        type: text
        example: Moderate
        description: e.g. High, Good, Moderate, Poor, Bad, Fail, Supports Good, Not High
      certainty:
        type: text
        example: Quite Certain
        description: How certain the EA is of the result (Very Certain, Quite Certain, Uncertain, No Information)

  ea_rnags:
    title: EA Reasons for Not Achieving Good
    description: >-
      The EA's reasons for not achieving good (RNAGs): for each element below
      Good, the activity and sector the EA thinks is responsible. Filled from
      the EA's Catchment Data Explorer by `importer classifications`, which
      replaces every row.
    filled_by: api
    columns:
      id:
        type: integer
        example: 570748
        primary_key: true
        description: The EA's ID for this reason
      catchment_id:
        type: text
        example: GB108050014460
        required: true
        index: true
        references: catchments.id
      cycle:
        type: integer
        example: 3
        description: River basin planning cycle
      element:
        type: text
        example: Macrophytes and Phytobenthos Combined
        description: The classification element that isn't Good
      element_status:
        type: text
        example: Moderate
        description: That element's status
      activity:
        type: text
        example: Poor Livestock Management
        description: What the EA thinks is causing it (shown on the dashboard as the EA RNAGs)
      activity_certainty:
        type: text
        example: Probable
        description: How sure the EA is (Suspect, Probable, Confirmed)
      business_sector:
        type: text
        example: Agriculture - Livestock
      category:
        type: text
        example: Agriculture and rural land management
      source_type:
        type: text
        example: Diffuse source
        description: e.g. Diffuse source, Point source, Physical modification
      national_issue:
        type: text
        example: Pollution from rural areas
        description: The national significant water management issue it comes under

  storm_overflows:
    title: Storm Overflows
    description: >-
      Storm overflow spills from the EA's storm overflow annual returns (Event
      Duration Monitoring), which every water company sends each year: a row per
      overflow per year, for overflows into an imported catchment's waterbody.
      Filled by `importer storm-overflows`, which replaces every row.
    filled_by: api
    columns:
      id:
        type: integer
        example: 1
        primary_key: true
        identity: true
      catchment_id:
        type: text
        example: GB108050014460
        required: true
        index: true
        references: catchments.id
        description: The WFD waterbody the overflow discharges into, as given in the return
      year:
        type: integer
        example: 2025
        required: true
        description: The year the return covers
      company:
        type: text
        example: South West Water
      site_name:
        type: text
        example: HIGH BICKINGTON STW_SO_HIGH BICKINGTON
        description: The water company's name for the overflow
      unique_id:
        type: text
        example: SBB00568
        description: The return's ID for the overflow (only from 2023, and it changed format in 2024)
      permit_reference:
        type: text
        example: 202194/CS/01
        description: The EA's permit reference
      activity_reference:
        type: text
        example: A2
        description: The activity on the permit
      asset_type:
        type: text
        example: Storm tank at WwTW
      receiving_water:
        type: text
        example: Langham Lake
      grid_reference:
        type: text
        example: SS 5916 2017
        description: The outlet's Ordnance Survey grid reference, as given in the return
      easting:
        type: integer
        example: 259160
        description: Worked out from the grid reference (British National Grid, metres)
      northing:
        type: integer
        example: 120170
      latitude:
        type: double
        example: 50.96
        description: Worked out from the easting and northing, for the maps
      longitude:
        type: double
        example: -4.0
      spill_hours:
        type: double
        example: 1911.98
        description: >-
          Total duration of all spills in the year, in hours, before the 12-24h
          counting. Empty when there's no figure (e.g. no monitor yet), which
          isn't the same as zero.
      spill_count:
        type: integer
        example: 173
        description: Spills, counted with the 12-24h count method

  river_obstacles:
    title: River Obstacles
    description: >-
      Weirs, culverts, fords, sluices and other obstacles in the rivers, from
      River Obstacles (the Environment Agency and The Rivers Trust). Each is in
      the catchment whose outline it's inside. Filled by `importer
      river-obstacles`, which replaces every row.
    filled_by: api
    columns:
      id:
        type: text
        example: 444d6377-dbeb-4ce7-a3f6-07241b6d5f22
        primary_key: true
        description: River Obstacles' ID for the obstacle
      ea_id:
        type: integer
        example: 39245
        description: The EA's ID for the obstacle
      catchment_id:
        type: text
        example: GB108050014460
        required: true
        index: true
        references: catchments.id
      site_name:
        type: text
        example: Sticklepath Weir
      obstacle_type:
        type: text
        example: culvert
        description: e.g. culvert, weir, ford, waterfall, sluice, dam
      origin:
        type: text
        example: artificial
        description: artificial, natural or unknown
      status:
        type: text
        example: operational
      latitude:
        type: double
        example: 50.95765
      longitude:
        type: double
        example: -3.99751

  # ---------------------------------------------------------------------------
  #  Waterbody Dashboard: the hand-written analysis, one catchment at a time
  # ---------------------------------------------------------------------------

  river_status_text:
    title: River Status Text
    description: >-
      The hand-written text on the Waterbody Dashboard's River Status page:
      one row per catchment. In Excel, Alt+Enter starts a new line in a cell;
      a blank line starts a new paragraph, and lines starting with a dash or •
      become a list.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      why_failing:
        type: text
        example: Langham Lake is currently at Moderate Ecological Status …
        description: Shown under "Why is the river failing?"
      happening_now:
        type: text
        example: Current activity includes investigations into the causes of failure …
        description: Shown under "What is happening now?"
      intervention_hypothesis:
        type: text
        example: Langham Lake appears relatively close to recovery …
        description: Shown under "Intervention hypothesis"
      hypothesis_confidence:
        type: text
        example: Med-High
        description: How confident the hypothesis is, shown after its heading, e.g. Low, Medium, Med-High, High

  interventions:
    title: Interventions
    description: >-
      The interventions table on the River Status page: what needs to change
      in each catchment, who leads it, what will be done and how we'll know.
      One row per intervention, grouped on the page into primary and
      contingency interventions.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      number:
        type: integer
        example: 1
        primary_key: true
        description: Its place in the catchment's list (1 first), within its priority
      priority:
        type: text
        example: Primary
        required: true
        description: Primary or Contingency, which group it's listed in
      desired_change:
        type: text
        example: Reduction in continuous discharges from sewage treatment works to permitted levels
        required: true
      lead_partner:
        type: text
        example: SWW
        description: Who leads it, e.g. SWW, Farmers, EA
      actions:
        type: text
        example: Asset and operational improvements
      how_we_will_know:
        type: text
        example: Effluent monitoring & permit compliance data
        description: Shown under "How we'll know"

  risk_levels:
    title: Risk Levels
    description: >-
      Each catchment's risk levels, shown as the coloured Risk Levels tiles on
      the River Status, Land Use Data and Sewerage Data pages: one row per
      catchment, one column per risk. Each level is Very Low, Low, Medium,
      High or Very High. Typed in until the rules for working them out are
      agreed.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      untreated_sewage:
        type: text
        example: Very High
        description: Untreated Sewage (storm overflows)
      sewage_private:
        type: text
        example: Medium
        description: Sewage (Private), e.g. septic tanks
      livestock:
        type: text
        example: Medium
      runoff:
        type: text
        example: High
      modification:
        type: text
        example: Low
        description: Physical modification of the river
      invasive_species:
        type: text
        example: Low
      overheating:
        type: text
        example: Low
      running_dry:
        type: text
        example: Very Low

  catchment_rankings:
    title: Catchment Ranking
    description: >-
      Each catchment's ranking, shown as e.g. "Catchment Ranking: 68/92" on
      every Waterbody Dashboard page (the 92 is the location's number of river
      waterbodies). Typed in until the rule for working it out is agreed.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      ranking:
        type: integer
        example: 68
        required: true

  ea_thresholds:
    title: EA Thresholds
    description: >-
      The thresholds for each measure on the EA Data page (Poor, Moderate,
      Good and High), per catchment, as some depend on the river's type. The
      measures are named as in EA Scores, e.g. Fish (EQR).
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      measure:
        type: text
        example: Fish (EQR)
        primary_key: true
        description: The measure, named as on the EA Data page and in EA Scores
      poor:
        type: double
        example: 0.03
      moderate:
        type: double
        example: 0.2
      good:
        type: double
        example: 0.4
      high:
        type: double
        example: 0.7

  # ---------------------------------------------------------------------------
  #  Waterbody Dashboard: land use and sewerage, one catchment at a time
  #  (the Catchment Dashboard adds these up for the whole location)
  # ---------------------------------------------------------------------------

  farms:
    title: Farms
    description: The number of farms in each catchment, shown on the Land Use Data page and added up on the Catchment Dashboard.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      number_of_farms:
        type: integer
        example: 68
        required: true

  livestock:
    title: Livestock
    description: >-
      The number of each kind of livestock in each catchment, for the Land Use
      Data page's Livestock Pressures. The density (per square kilometre) is
      worked out from the catchment's area.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      livestock:
        type: text
        example: Dairy cattle
        primary_key: true
        description: e.g. Beef cattle, Dairy cattle, Pigs, Poultry, Sheep
      number:
        type: integer
        example: 1137
        required: true
      density_rating:
        type: text
        example: Medium
        description: Low, Medium or High. Typed in until the rule for working it out is agreed.

  phosphate_sources:
    title: Phosphate Sources
    description: >-
      Where each catchment's phosphate comes from (estimated), as a percentage
      per source, for now (2025) and as projected (2030). Shown on the Land Use
      Data page; the Sewerage Data page adds the sources up into continuous and
      diffuse.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      source:
        type: text
        example: STW (SWW)
        primary_key: true
        description: e.g. Arable, CSOs (SWW), Highways, Industry, Livestock, STW (Private), STW (SWW), Urban
      year:
        type: integer
        example: 2025
        primary_key: true
        description: The year the estimate is for, e.g. 2025 or 2030
      percent:
        type: double
        example: 60.9
        required: true
        description: The source's share of the catchment's phosphate, in %
      discharge:
        type: text
        example: Continuous
        description: >-
          Continuous (e.g. sewage treatment works) or Diffuse (everything
          else), for the Sewerage Data page's Source of Phosphate

  sewerage_properties:
    title: Sewerage Properties
    description: >-
      How many properties in each catchment are on the water company's
      sewerage and how many on private sewerage (e.g. septic tanks). Shown on
      the Sewerage Data page, with private sewerage per hectare worked out from
      the catchment's area, and added up on the Catchment Dashboard.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      public_sewerage_properties:
        type: integer
        example: 310
        description: Properties on the water company's sewerage (e.g. SWW)
      private_sewerage_properties:
        type: integer
        example: 467
        description: Properties on private sewerage

  sewerage_improvements:
    title: Sewerage Improvements
    description: >-
      The water company's planned improvements to its sites in each catchment,
      for the Sewerage Data page's Asset Improvement Plans.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: GB108050014460
        primary_key: true
        references: catchments.id
      site_name:
        type: text
        example: HIGH BICKINGTON STW
        primary_key: true
      improvements:
        type: text
        example: Storage, New screen, Operational (e.g. blockages)
      completion_year:
        type: integer
        example: 2035
      predicted_spills_per_year:
        type: integer
        example: 10
        description: Predicted number of spills a year once the work is done

  # ---------------------------------------------------------------------------
  #  About a whole location
  # ---------------------------------------------------------------------------

  location_text:
    title: Location Text
    description: >-
      The hand-written text about a whole location: one row per location. In
      Excel, Alt+Enter starts a new line in a cell; a blank line starts a new
      paragraph, and lines starting with a dash or • become a list.
    filled_by: excel
    columns:
      location_id:
        type: integer
        example: 1
        primary_key: true
        references: locations.id
        description: The location (see the Locations table), e.g. 1 for North Devon
      why_failing:
        type: text
        example: 80 of North Devon's 92 river water bodies are currently failing …
        description: Catchment Dashboard, under "Why is the river system failing?"
      happening_now:
        type: text
        example: Partners across the catchment are …
        description: Catchment Dashboard, under "What is happening now?"
      intervention_hypothesis:
        type: text
        example: Most failing waterbodies need action on both …
        description: Catchment Dashboard, under "Intervention hypothesis"
      intermittent_discharges:
        type: text
        example: Intermittent Discharges occur when the sewers are overwhelmed …
        description: Sewerage Data page, what intermittent discharges are (the same for every catchment)
      continuous_discharge:
        type: text
        example: Continuous Discharge is the release of treated sewage …
        description: Sewerage Data page, what continuous discharge is (the same for every catchment)
      about_waterbody_dashboard:
        type: text
        example: What needs to happen to bring each waterbody up to "Good" ecological status? …
        description: Shown under the Waterbody Dashboard
      about_catchment_dashboard:
        type: text
        example: The Catchment Dashboard brings together …
        description: Shown under the Catchment Dashboard
      contact_email:
        type: text
        example: biosphere-mailbox@devon.gov.uk
        description: Shown under the dashboards, for questions about the data
