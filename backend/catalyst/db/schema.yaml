# =============================================================================
#  Catchment Catalyst – database schema  (MASTER FILE)
# =============================================================================
#
#  This file lists every table and column in the database. To change the
#  database, edit this file, then from the project folder run:
#
#      docker compose run --rm schema plan      # preview the changes (safe)
#      docker compose run --rm schema apply     # make the changes
#
#  The tool compares this file with the database and works out the changes
#  itself, so no SQL is needed. Changes are all-or-nothing: if any step fails,
#  nothing is changed.
#
#  Changes that would delete data (removing a table or column, or changing a
#  column's type) are refused unless you add --allow-data-loss to `apply`.
#
#  RENAMING: change the name and add `renamed_from: <old name>` to the table
#  or column. Without it, a rename is treated as "delete the old one and add
#  a new empty one". The line is harmless if left in afterwards.
#
#  -----------------------------------------------------------------------------
#  Column options
#  -----------------------------------------------------------------------------
#    type          Required. One of:
#                    text, varchar(N), integer, bigint, smallint,
#                    numeric, numeric(P,S), double, real, boolean,
#                    date, timestamptz, jsonb, uuid,
#                    bytea (a file, kept as it came),
#                    geometry(<Point | LineString | Polygon | MultiPoint |
#                             MultiLineString | MultiPolygon>, <SRID>)
#                  Add [] for a list of values, e.g. text[] (not for
#                  geometry, jsonb or bytea).
#    description   What the column holds. Saved as a comment in the database.
#    required      true = must always have a value. Default: false.
#    primary_key   true = part of the table's primary key (always required).
#    identity      true = numbered automatically (integer primary keys).
#    unique        true = no two rows can have the same value.
#    index         true = add an index for faster lookups. Geometry columns
#                  get a spatial index.
#    default       Value used when none is given. Numbers and true/false are
#                  written as they are. Anything else is SQL, so text needs
#                  inner quotes:  default: "'draft'"   or   default: now()
#    references    other_table.column (a link to a row in another table).
#    on_delete     What happens to this row when the row it references is
#                  deleted: cascade (delete this row too) | set null |
#                  restrict. If left out, the delete is refused.
#    renamed_from  The column's previous name (see RENAMING above).
#    example       Example values, shown on the admin page as rows 2, 3, …
#                  of the table's columns when it's clicked
#                  (catalyst/admin/diagram.py). A list, one value a row, e.g.
#                    example: [Farmland, Woodland, Urban]
#                  Every column in a table needs as many (null for an empty
#                  cell); a single value is one row. Not stored in the database.
#
#  Table options:  title, description, filled_by, input, columns, indexes, renamed_from
#    title         Friendly name, e.g. EA Scores. Shown on the admin page.
#    filled_by     How the table gets its data:
#                    api    an importer downloads it from an outside service
#                           (code in backend/catalyst/importers/api/)
#                    excel  uploaded as an Excel file in the admin page, in
#                           the table's own layout (1 to 1). The table then
#                           appears there automatically, with no code to
#                           write. Each upload replaces the table's rows, so
#                           the table needs a primary key, and its columns
#                           can only be text, varchar(N), integer, bigint,
#                           smallint, double, boolean or date.
#                    input  worked out from a source file (one of the files
#                           the original Power BI dashboard read), uploaded
#                           in the admin page as it comes, with the original's
#                           formulas. Say which with `input` (below). Same
#                           rules as excel.
#                  Leave it out for tables filled some other way (e.g. the
#                  admin page's own records).
#    input         For `filled_by: input`: the source file's code, in
#                  backend/catalyst/importers/inputs/, e.g. apha_livestock.
#                  One source file can fill several tables.
#    indexes       Indexes over several columns, for example:
#                    indexes:
#                      - columns: [location_id, year]
#                        unique: true
#
#  -----------------------------------------------------------------------------
#  Two kinds of table
#  -----------------------------------------------------------------------------
#    tables        Core tables: the catchments, the locations and the list of
#                  datasets.
#    data_tables   One table per dataset (EA scores, habitat, livestock, ...).
#                  Every data table must have a required catchment_id column
#                  that references catchments.id, so every row belongs to a
#                  catchment. The catchment ID is the EA WFD waterbody ID.
#                  Data about a whole location (e.g. its text) has a required
#                  location_id column that references locations.id instead.
# =============================================================================

extensions:
  - postgis          # spatial types: boundaries, river lines, points

tables:

  # ---------------------------------------------------------------------------
  #  Core tables
  # ---------------------------------------------------------------------------

  catchments:
    title: Catchments
    description: >-
      Every EA Water Framework Directive (WFD) waterbody catchment. Never
      edited by hand: anything typed goes in its own table, linked by
      Catchment ID.
    filled_by: api
    columns:
      id:
        type: text
        example: [GB108050008080, GB108050008110, GB108050014460, GB108050014340]
        primary_key: true
        description: Catchment ID, which is the EA WFD waterbody ID
      name:
        type: text
        example: [West Okement, Middle River Okement, Langham Lake, Lower Little River Dart]
        required: true
        description: EA name. Names are not unique nationally, so data is always linked by Catchment ID.
      waterbody_type:
        type: text
        example: [River, River, River, River]
        required: true
        description: River, Lake, Transitional (estuary), Coastal or Groundwater
      river_basin_district_id:
        type: integer
        example: [8, 8, 8, 8]
        description: EA ID of the river basin district
      river_basin_district:
        type: text
        example: [South West, South West, South West, South West]
        description: EA river basin district the catchment is in
      management_catchment_id:
        type: integer
        example: [3062, 3062, 3062, 3062]
        index: true
        description: EA ID of the management catchment. Can be used to choose a location's catchments.
      management_catchment:
        type: text
        example: [North Devon, North Devon, North Devon, North Devon]
        description: EA management catchment name
      operational_catchment_id:
        type: integer
        example: [3468, 3468, 3441, 3441]
        description: EA ID of the operational catchment
      operational_catchment:
        type: text
        example: [Torridge, Torridge, Taw and North Devon Streams, Taw and North Devon Streams]
        description: EA operational catchment, a smaller grouping within the management catchment
      hydromorphological_designation:
        type: text
        example:
          - not designated artificial or heavily modified
          - not designated artificial or heavily modified
          - not designated artificial or heavily modified
          - not designated artificial or heavily modified
        description: Whether the EA designates the waterbody as artificial or heavily modified
      area_ha:
        type: double
        example: [3174.75, 3993.15, 2752.27, 6134.91]
        description: Catchment area in hectares, calculated from the boundary (matches the EA's figure)
      river_length_km:
        type: double
        example: [21.13, 23.86, 15.53, 20.52]
        description: River length in kilometres, as shown on the EA's Catchment Data Explorer page
      boundary:
        type: geometry(MultiPolygon, 4326)
        example:
          - "(outline on the map)"
          - "(outline on the map)"
          - "(outline on the map)"
          - "(outline on the map)"
        index: true
        description: >-
          Catchment boundary as latitude/longitude (WGS84). Converted from
          British National Grid on import.
      river_line:
        type: geometry(MultiLineString, 4326)
        example: ["(line on the map)", "(line on the map)", "(line on the map)", "(line on the map)"]
        description: River line(s) as latitude/longitude (WGS84)
      upstream_ids:
        type: text[]
        example:
          - "(none)"
          - "GB108050008100, GB108050008080"
          - GB108050014490
          - "GB108050013980, GB108050013960, GB108050013990"
        description: >-
          Catchment IDs of the waterbodies that flow into this one, from the
          EA. Look their names up in this table.
      downstream_ids:
        type: text[]
        example: [GB108050008110, GB108050008130, GB108050014530, GB108050014280]
        description: >-
          Catchment IDs of the waterbodies this one flows into, from the EA.
          Look their names up in this table. Some (e.g. estuaries) aren't
          imported yet, so have no row.
      imported_at:
        type: timestamptz
        example: ["2026-10-29 14:38", "2026-10-29 14:38", "2026-10-29 14:38", "2026-10-29 14:38"]
        required: true
        default: now()
        description: When this catchment was last imported from the EA

  locations:
    title: Locations
    description: >-
      One row per dashboard location (e.g. North Devon): its name and its
      catchments. Each is published as its own dashboard, showing only its
      catchments.
    columns:
      id:
        type: integer
        example: [1, 2, 3, 4]
        primary_key: true
        identity: true
        description: Location ID
      name:
        type: text
        example: [North Devon, Exe, Tamar, South Devon]
        required: true
        unique: true
        description: Name of the location
      catchment_ids:
        type: text[]
        example:
          - "GB108050008080, GB108050008100, …"
          - "(the Exe's waterbody IDs)"
          - "(the Tamar's waterbody IDs)"
          - "(South Devon's waterbody IDs)"
        required: true
        index: true
        description: >-
          Catchment IDs of the catchments in this location. A catchment can be
          in more than one location. Each ID must be in the catchments table:
          whatever saves a location checks this, because the database can't
          check IDs inside a list.

  datasets:
    title: Datasets
    description: >-
      The text in the dashboard's "i" info buttons: one row for each data
      table that has one, plus the Risk Levels panel (risk_levels) and the
      Catchment Ranking panel (catchment_rankings). A panel's "i" button is
      greyed out until it has a row here. Text can have paragraphs, bullets,
      bold, links, headings and sections, written as described under Location
      Text.
    filled_by: excel
    columns:
      table_name:
        type: text
        example: [livestock, habitat_land_use, phosphate_sources, sewerage_improvements]
        primary_key: true
        description: >-
          The data table, by its name in the database (shown under its title
          when you click it on the admin page), e.g. livestock. Or risk_levels,
          for the Risk Levels panel, or catchment_rankings, for the Catchment
          Ranking panel
      info_text:
        type: text
        example:
          - "Livestock data via FoIR to the Animal and Plant Health …"
          - "Habitat mapping from Natural England 22/23. Habitat types …"
          - "Phosphate source data is from EA SAGIS modelling. Due to …"
          - "From Water UK's national storm overflows plan …"
        required: true
        description: What the "i" button shows, e.g. where the data comes from, how up to date it is, and any caveats

  uploads:
    title: Uploads
    description: >-
      One row for each file uploaded in the admin page: which table or source
      file it was for, who uploaded it and when, what it changed, and the file
      itself, so an earlier version can be downloaded from the admin page and
      uploaded again (e.g. after a formula changes). Being in the database,
      the files are in its backups too.
    columns:
      id:
        type: integer
        example: [39, 43, 44, 45]
        primary_key: true
        identity: true
        description: Upload ID
      uploaded_to:
        renamed_from: table_name
        type: text
        example: [apha_livestock, habitat, sagis_phosphate, ea_classification_facts]
        required: true
        description: >-
          The table the file was uploaded to, or for a source file, its code
          (e.g. apha_livestock), as it can fill several tables
      file_name:
        type: text
        example:
          - APHA Livestock Data Feb 2026.xlsx
          - Nat Eng Simplified Habitat.csv
          - SAGIS Phosphate source.xlsx
          - North Devon WB Classification Facts Data.xlsx
        required: true
        description: Name of the file that was uploaded
      file:
        type: bytea
        required: true
        description: The file, exactly as it was uploaded
      uploaded_by:
        type: text
        example: [admin, admin, admin, admin]
        required: true
        description: Who uploaded it (their admin login name)
      uploaded_at:
        type: timestamptz
        example: ["2026-11-18 13:50", "2026-11-18 15:09", "2026-11-18 15:25", "2026-11-18 15:53"]
        required: true
        default: now()
      status:
        type: text
        example: [approved, approved, approved, approved]
        required: true
        default: "'preview'"
        description: >-
          preview (waiting for someone to check and approve it), approved (the
          table's rows were replaced with the file's) or cancelled
      rows_in_file:
        type: integer
        example: [92, 459, 910, 96402]
        required: true
      rows_added:
        type: integer
        example: [93, 0, 364, 0]
        required: true
        description: Rows in the file that weren't in the table
      rows_changed:
        type: integer
        example: [459, 459, 401, 10]
        required: true
        description: Rows in both, with different values
      rows_removed:
        type: integer
        example: [0, 0, 0, 0]
        required: true
        description: Rows in the table that weren't in the file, so are deleted
      changes:
        type: jsonb
        example:
          - '{"livestock": [1, 459, 0], "livestock_pressure": [92, 0, 0]}'
          - '{"habitat_land_use": [0, 459, 0]}'
          - '{"phosphate_sources": [0, 401, 0], "phosphate_point_diffuse": [364, 0, 0]}'
          - '{"ea_scores": [0, 10, 0], "ea_thresholds": [0, 0, 0]}'
        description: >-
          For a source file: the rows added, changed and deleted in each table
          it fills (the three columns above are their totals). Empty for an
          upload to one table.
      approved_at:
        type: timestamptz
        example: ["2026-11-18 13:51", "2026-11-18 15:10", "2026-11-18 15:25", "2026-11-18 15:53"]
        description: When it was approved and the table's rows were replaced
      examples:
        type: jsonb
        example:
          - '{"livestock": {"waterbody": "Abbey River", "in": {...}, "out": {...}, "steps": {...}}}'
          - '{"habitat_land_use": {"waterbody": "Abbey River", "in": {...}, "out": {...}, "steps": {...}}}'
          - '{"phosphate_sources": {"waterbody": "Lower River Lew (Torridge)", "in": {...}, "out": {...}, "steps": {...}}}'
          - '{"ea_scores": {"waterbody": "Waldon", "in": {...}, "out": {...}, "steps": {...}}}'
        description: >-
          A few of the file's rows, and what each table it fills makes of
          them, for the admin page's Transformation panels (see
          catalyst/admin/examples.py). Made from the file, so it can be made
          again; empty for uploads before 20 November 2026 until it is

  publishes:
    title: Publishes
    description: >-
      One row each time the public dashboards were published (written again
      from the database), with the admin page's Publish button or the publish
      command. The admin page uses it to show how many uploads have been
      approved since the last publish, so aren't on the dashboards yet.
    columns:
      id:
        type: integer
        example: [20, 21, 22, 23]
        primary_key: true
        identity: true
        description: Publish ID
      published_at:
        type: timestamptz
        example: ["2026-11-18 15:10", "2026-11-18 15:25", "2026-11-18 15:54", "2026-11-20 11:25"]
        required: true
        default: now()
        description: When the publish started. Everything approved before then is on the dashboards.
      published_by:
        type: text
        example: [admin, admin, null, admin]
        description: Who pressed Publish (their admin login name). Empty if it was the publish command.


data_tables:

  # ---------------------------------------------------------------------------
  #  One table per dataset. Every row has a catchment_id, except in tables
  #  about a whole location, which have a location_id instead.
  # ---------------------------------------------------------------------------

  ea_scores:
    title: EA Scores
    description: >-
      The measured values behind the EA's statuses (e.g. Fish (EQR) 0.36): one
      row per catchment, measure and year.
    filled_by: input
    input: ea_classification_facts
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      measure:
        type: text
        example: [Fish (EQR), Fish (EQR), Phosphate (mg/l), Phosphate (mg/l)]
        primary_key: true
        description: The measure, named as on the EA Data page, e.g. Fish (EQR), Phosphate (mg/l), pH Lower
      year:
        type: integer
        example: [2019, 2022, 2016, 2022]
        primary_key: true
        description: Classification year, e.g. 2022
      status:
        type: text
        example: [Moderate, Moderate, Good, Moderate]
        description: >-
          The value's status (High, Good, Moderate, Poor or Bad) from its
          thresholds, which colours it. Where the EA classifies the item itself
          (e.g. Fish), the dashboard uses the EA's status instead.
      value:
        type: double
        example: [0.382, 0.363, 0.048, 0.057]
        description: The measured value, e.g. Fish EQR 0.36 or phosphate 0.057 mg/l

  habitat_land_use:
    title: Habitat & Land Use
    description: >-
      Area of each habitat type in each catchment, its share of the
      catchment's habitat areas, and its relative coverage.
    filled_by: input
    input: habitat
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      habitat:
        type: text
        example: [Farmland, Woodland, Not Farmed, Urban]
        primary_key: true
        description: Farmland, Not Farmed, Urban, Wetland or Woodland
      area_ha:
        type: double
        example: [1710.55, 439.26, 423.15, 91.29]
        required: true
        description: Area in hectares
      percent_of_catchment:
        type: double
        example: [62.16, 15.96, 15.38, 3.32]
        description: The habitat's share of all the catchment's habitat areas added up, in %
      relative_coverage:
        type: text
        example: [High, Medium, Medium, Medium]
        description: >-
          Low, Medium or High, from the % of catchment, with bands for each
          habitat (shown on the admin page)

  ea_classifications:
    title: EA Classifications
    description: >-
      The EA's Water Framework Directive classifications: the status of each
      item (Ecological, Fish, Phosphate, ...) in each classification year.
    filled_by: api
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      item:
        type: text
        example: [Ecological, Biological quality elements, Fish, Phosphate]
        primary_key: true
        description: The EA's classification item, e.g. Ecological, Fish, Phosphate, Chemical
      year:
        type: integer
        example: [2022, 2022, 2022, 2022]
        primary_key: true
        description: Classification year
      cycle:
        type: integer
        example: [3, 3, 3, 3]
        primary_key: true
        description: >-
          River basin planning cycle. Some years were classified in two cycles
          (e.g. 2019 in cycles 2 and 3): the dashboard uses the later one.
      level:
        type: text
        example: ["Ecological, chemical or quantitative status", Component, Element, Element]
        description: Where the item sits, e.g. Ecological, chemical or quantitative status, Component, Element, Sub Element
      status:
        type: text
        example: [Moderate, Moderate, Moderate, Moderate]
        description: e.g. High, Good, Moderate, Poor, Bad, Fail, Supports Good, Not High
      certainty:
        type: text
        example: [Very Certain, Very Certain, Uncertain, Uncertain]
        description: How certain the EA is of the result (Very Certain, Quite Certain, Uncertain, No Information)

  ea_rnags:
    title: EA Reasons for Not Achieving Good
    description: >-
      The EA's reasons for not achieving good (RNAGs): for each element below
      Good, the activity and sector the EA thinks is responsible.
    filled_by: api
    columns:
      id:
        type: integer
        example: [570997, 570996, 570995, 570994]
        primary_key: true
        description: The EA's ID for this reason
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        required: true
        index: true
        references: catchments.id
      cycle:
        type: integer
        example: [3, 3, 3, 3]
        description: River basin planning cycle
      element:
        type: text
        example:
          - Macrophytes and Phytobenthos Combined
          - Macrophytes and Phytobenthos Combined
          - Macrophytes and Phytobenthos Combined
          - Macrophytes and Phytobenthos Combined
        description: The classification element that isn't Good
      element_status:
        type: text
        example: [Moderate, Moderate, Moderate, Moderate]
        description: That element's status
      activity:
        type: text
        example:
          - Poor Livestock Management
          - Poor soil management
          - Poor nutrient management
          - Sewage discharge (continuous)
        description: What the EA thinks is causing it (shown on the dashboard as the EA RNAGs)
      activity_certainty:
        type: text
        example: [Probable, Probable, Probable, Probable]
        description: How sure the EA is (Suspect, Probable, Confirmed)
      business_sector:
        type: text
        example: [Agriculture - Livestock, Agriculture - Arable, Agriculture - Livestock, Water supply]
      category:
        type: text
        example:
          - Agriculture and rural land management
          - Agriculture and rural land management
          - Agriculture and rural land management
          - Water Industry
      source_type:
        type: text
        example: [Diffuse source, Diffuse source, Diffuse source, Point source]
        description: e.g. Diffuse source, Point source, Physical modification
      national_issue:
        type: text
        example:
          - Pollution from rural areas
          - Pollution from rural areas
          - Pollution from rural areas
          - Pollution from waste water
        description: The national significant water management issue it comes under

  storm_overflows:
    title: Storm Overflows
    description: >-
      Storm overflow spills from the EA's yearly returns (Event Duration
      Monitoring), which every water company sends: a row per overflow per
      year.
    filled_by: api
    columns:
      id:
        type: integer
        example: [1258, 1361, 1353, 1440]
        primary_key: true
        identity: true
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        required: true
        index: true
        references: catchments.id
        description: The WFD waterbody the overflow discharges into, as given in the return
      year:
        type: integer
        example: [2024, 2025, 2024, 2025]
        required: true
        description: The year the return covers
      company:
        type: text
        example: [South West Water, South West Water, South West Water, South West Water]
      site_name:
        type: text
        example:
          - HIGH BICKINGTON STW_SO_HIGH BICKINGTON
          - HIGH BICKINGTON STW_SO_HIGH BICKINGTON
          - YARNSCOMBE STW_SSO_YARNSCOMBE
          - YARNSCOMBE STW_SSO_YARNSCOMBE
        description: The water company's name for the overflow
      unique_id:
        type: text
        example: [SBB00568, SBB00568, SBB01383, SBB01383]
        description: The return's ID for the overflow (only from 2023, and it changed format in 2024)
      permit_reference:
        type: text
        example: ["202194/CS/01", "202194/CS/01", "200402", "200402"]
        description: The EA's permit reference
      activity_reference:
        type: text
        example: [A2, A2, A3, A3]
        description: The activity on the permit
      asset_type:
        type: text
        example: [Inlet SO at WwTW, Inlet SO at WwTW, Storm tank at WwTW, Storm tank at WwTW]
      receiving_water:
        type: text
        example:
          - TRIBUTARY OF LANGHAM LAKE(S)
          - TRIBUTARY OF LANGHAM LAKE(S)
          - TRIBUTARY OF LANGHAM LAKE(S)
          - TRIBUTARY OF LANGHAM LAKE(S)
      grid_reference:
        type: text
        example: [SS59162017, SS59162017, SS55782367, SS55782367]
        description: The outlet's Ordnance Survey grid reference, as given in the return
      easting:
        type: integer
        example: [259160, 259160, 255780, 255780]
        description: Worked out from the grid reference (British National Grid, metres)
      northing:
        type: integer
        example: [120170, 120170, 123670, 123670]
      latitude:
        type: double
        example: [50.96369, 50.96369, 50.9943, 50.9943]
        description: Worked out from the easting and northing, for the maps
      longitude:
        type: double
        example: [-4.00697, -4.00697, -4.05646, -4.05646]
      spill_hours:
        type: double
        example: [2656.98, 1911.98, 4.61, 273.68]
        description: >-
          Total duration of all spills in the year, in hours, before the 12-24h
          counting. Empty when there's no figure (e.g. no monitor yet), which
          isn't the same as zero.
      spill_count:
        type: integer
        example: [233, 173, 3, 29]
        description: Spills, counted with the 12-24h count method


  sewage_overflow_pressure:
    title: Sewage Overflow Pressure
    description: >-
      The Untreated Sewage risk tile: each catchment's total storm overflow
      spill hours in the latest year, and the risk level they make.
    filled_by: api
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014340, GB108050013950, GB108050008080]
        primary_key: true
        references: catchments.id
      year:
        type: integer
        example: [2025, 2025, 2025, 2025]
        required: true
        description: The year of the returns the hours are from (the latest)
      spill_hours:
        type: double
        example: [2185.66, 5301.33, 41.82, 4.47]
        required: true
        description: The hours all the catchment's storm overflows spilled that year. 0 if it has none.
      pressure:
        type: text
        example: [Very High, Very High, Very Low, Very Low]
        required: true
        description: Very Low, Low, Medium, High or Very High, from the spill hours
  river_obstacles:
    title: River Obstacles
    description: >-
      Weirs, culverts, fords, sluices and other obstacles in the rivers, each
      in the catchment whose outline it's inside.
    filled_by: api
    columns:
      id:
        type: text
        example:
          - "444d6377-dbeb-4ce7-a3f6-07241b6d5f22"
          - "86786b41-a2a1-4eed-a45c-40e7a0adbdba"
          - b42508b3-8e81-4d4d-97fc-e45702784261
          - "7cb9a349-8cdd-483a-9a5a-ae4e08477f43"
        primary_key: true
        description: River Obstacles' ID for the obstacle
      ea_id:
        type: integer
        example: [39245, 757, 762, 719]
        description: The EA's ID for the obstacle
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014210, GB108050014660, GB108050014660]
        required: true
        index: true
        references: catchments.id
      site_name:
        type: text
        example: [null, Rashleigh Weir, Taddiport Weir, Beam Weir]
      obstacle_type:
        type: text
        example: [culvert, weir, weir, weir]
        description: e.g. culvert, weir, ford, waterfall, sluice, dam
      origin:
        type: text
        example: [artificial, artificial, artificial, artificial]
        description: artificial, natural or unknown
      status:
        type: text
        example:
          - null
          - fish_passage_solution_technical
          - fish_passage_solution_technical
          - fish_passage_solution_technical
      latitude:
        type: double
        example: [50.95765, 50.90285, 50.94792, 50.96464]
      longitude:
        type: double
        example: [-3.99751, -3.88569, -4.15586, -4.17358]

  postcodes:
    title: Postcodes
    description: >-
      Every postcode whose centre is inside a catchment, for the postcode
      search. A postcode outside every catchment (e.g. by an estuary or the
      sea) has no row.
    filled_by: api
    columns:
      postcode:
        type: text
        example: [EX19 8TE, EX31 3HP, EX31 3LB, EX31 3LL]
        primary_key: true
        description: With a space before the last three characters
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        required: true
        index: true
        references: catchments.id
      latitude:
        type: double
        example: [50.94487, 50.99449, 50.99415, 51.00067]
        description: The postcode's centre (Code-Point Open's point for it)
      longitude:
        type: double
        example: [-4.00857, -4.05058, -4.05081, -4.05255]

  # ---------------------------------------------------------------------------
  #  Waterbody Dashboard: the hand-written analysis, one catchment at a time
  # ---------------------------------------------------------------------------

  river_status_text:
    title: River Status Text
    description: >-
      The River Status page's text, written by the North Devon Biosphere: one
      row per catchment. Text can have paragraphs, bullets, bold, links,
      headings and sections, written as described under Location Text.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014340, GB108050013950, GB108050008080]
        primary_key: true
        references: catchments.id
      why_failing:
        type: text
        example:
          - "Langham Lake is currently at Moderate Ecological Status and …"
          - "Lower Little River Dart is currently at Moderate Ecological …"
          - "Nadrid Water is currently at Moderate Ecological Status …"
          - "West Okement is currently at Poor Ecological Status. The …"
        description: Shown under "Why is the river failing?"
      happening_now:
        type: text
        example:
          - "Current activity includes investigations into the causes of …"
          - "Current activity includes Northern Devon Natural Solutions …"
          - "Current activity includes Northern Devon Natural Solutions …"
          - "Current activity includes investigations into the causes of …"
        description: Shown under "What is happening now?"
      intervention_hypothesis:
        type: text
        example:
          - "Langham Lake appears relatively close to recovery. Both …"
          - "The evidence points towards a classic mixed-source nutrient …"
          - "Nadrid Water differs from several neighbouring Bray and …"
          - "The evidence does not support a nutrient-led diagnosis …"
        description: Shown under "Intervention hypothesis"
      hypothesis_confidence:
        type: text
        example: [Med-High, Med-High, Med-High, Medium]
        description: How confident the hypothesis is, shown after its heading, e.g. Low, Medium, Med-High, High

  esme_risk_levels:
    title: ESME Risk Levels
    description: >-
      Five of the risk tiles (Modification, Runoff, Running Dry, Invasive
      Species and Overheating), each from one of ESME's (Ecosystem Service Map
      Explorer) indicators for the river. Each is Very Low, Low, Medium, High
      or Very High.
    filled_by: input
    input: esme
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014340, GB108050013950, GB108050008080]
        primary_key: true
        references: catchments.id
      habitat_quality:
        type: integer
        example: [4, 3, 3, 3]
        description: ESME's R1 River Habitat Quality Index, 1 (very low) to 5 (very high)
      modification:
        type: text
        example: [Low, Medium, Medium, Medium]
        description: The Modification tile, from the habitat quality
      runoff_and_infiltration:
        type: integer
        example: [2, 3, 2, 3]
        description: ESME's R24 Runoff and Infiltration, 1 to 5 (5 holds the most rain back)
      runoff:
        type: text
        example: [High, Medium, High, Medium]
        description: The Runoff tile, from runoff and infiltration
      abstraction_sustainability:
        type: integer
        example: [5, 5, 5, 2]
        description: ESME's R27 Abstraction sustainability, 1 to 5 (5 is the most sustainable)
      running_dry:
        type: text
        example: [Very Low, Very Low, Very Low, High]
        description: The Running Dry tile, from abstraction sustainability
      invasive_species_found:
        type: text
        example: ["No", One species, "No", "No"]
        description: ESME's R17 Invasive non-native species, e.g. No or One species
      invasive_species:
        type: text
        example: [Low, High, Low, Low]
        description: The Invasive Species tile
      river_shade:
        type: text
        example: [Shaded, Shaded, Shaded, Medium shade]
        description: ESME's R10 River shade, e.g. Shaded, Medium shade or No shade
      overheating:
        type: text
        example: [Low, Low, Low, Medium]
        description: The Overheating tile, from the river shade

  waterbody_figures:
    renamed_from: waterbody_lookup
    title: Waterbody Figures
    description: >-
      The Waterbody Lookup's figures, one row per catchment: its ranking, its
      2025 ecological class, its river information, its number of farms and
      its properties on public and private sewerage. A figure the lookup
      doesn't have is left empty.
    filled_by: input
    input: waterbody_lookup
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014340, GB108050013950, GB108050008080]
        primary_key: true
        references: catchments.id
      ranking:
        type: integer
        example: [68, 58, 47, 86]
        description: >-
          The catchment's ranking, shown as e.g. "Catchment Ranking: 68/92" on
          every Waterbody Dashboard page (the 92 is the location's number of
          river waterbodies)
      ecological_class_year:
        type: integer
        example: [2025, 2025, 2025, 2025]
        description: The year of its ecological class, one the EA's Catchment Data Explorer doesn't have yet
      ecological_class:
        type: text
        example: [Moderate, Moderate, Moderate, Poor]
        description: >-
          High, Good, Moderate, Poor or Bad. The maps' colours, the class
          counts and that year in EA Ecological Classification use it in place
          of the EA's own
      catchment_area_ha:
        type: double
        example: [2752.02, 6134.36, 1097.57, 3172.4]
        description: The catchment's area in hectares (River Information, on the Land Use Data page)
      river_length_km:
        type: double
        example: [13.85, 19.84, 8.05, 20.36]
        description: The river's length in km
      river_system:
        type: text
        example: [Taw, Taw, Taw, Torridge]
        description: e.g. Taw, Torridge, Lyn or Coastal
      upstream_rivers:
        type: text
        example: [Newton Tracey Stream, "Upper Little Dart, Huntacott Water, Sturcombe River", None, None]
        description: The rivers upstream, by name, separated by commas, or None
      downstream_rivers:
        type: text
        example:
          - Taw (River Mole to Estuary)
          - Taw (Little Dart to River Mole)
          - Bray (Mole to Hole Water)
          - Middle River Okemont
        description: The rivers (or e.g. Sea) downstream, by name, separated by commas
      number_of_farms:
        type: integer
        example: [68, 115, 21, 13]
        description: Shown on the Land Use Data page, and added up on the Catchment Dashboard
      public_sewerage_properties:
        type: integer
        example: [310, 998, 1394, 784]
        description: Properties on the water company's sewerage (e.g. SWW), shown on the Sewerage Data page and added up on the Catchment Dashboard
      private_sewerage_properties:
        type: integer
        example: [467, 1295, 1428, 826]
        description: Properties on private sewerage (e.g. septic tanks)
      private_sewerage_per_ha:
        type: double
        example: [0.17, 0.211, 1.3, 0.26]
        description: Properties on private sewerage per hectare of the catchment (its area in the Waterbody Lookup)
      private_sewerage_rating:
        type: text
        example: [Medium, Medium, Very High, Medium]
        description: Very Low, Low, Medium, High or Very High, from private sewerage per hectare. The Sewage (Private) tile in Risk Levels

  ea_thresholds:
    title: EA Thresholds
    description: >-
      The Poor, Moderate, Good and High thresholds for each measure in EA
      Scores, per catchment, as some depend on the river's type. Fixed for
      biology; the waterbody's latest boundaries for physico-chemistry.
    filled_by: input
    input: ea_classification_facts
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      measure:
        type: text
        example: [Fish (EQR), Inverts NTAXA (EQR), Phosphate (mg/l), "Dissolved Oxygen (%)"]
        primary_key: true
        description: The measure, named as on the EA Data page and in EA Scores
      poor:
        type: double
        example: [0.03, 0.47, 0.927, 50]
      moderate:
        type: double
        example: [0.2, 0.56, 0.143, 64]
      good:
        type: double
        example: [0.4, 0.68, 0.054, 75]
      high:
        type: double
        example: [0.7, 0.8, 0.027, 80]

  # ---------------------------------------------------------------------------
  #  Waterbody Dashboard: land use and sewerage, one catchment at a time
  #  (the Catchment Dashboard adds these up for the whole location)
  # ---------------------------------------------------------------------------

  livestock:
    title: Livestock
    description: >-
      The number of each kind of livestock in each catchment, with its density
      and density rating.
    filled_by: input
    input: apha_livestock
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014150]
        primary_key: true
        references: catchments.id
      livestock:
        type: text
        example: [Beef cattle, Dairy cattle, Sheep, Dairy cattle]
        primary_key: true
        description: Beef cattle, Dairy cattle, Pigs, Poultry or Sheep
      number:
        type: integer
        example: [815, 1137, 5558, null]
        description: >-
          How many there are. 0 where APHA gives none. Empty where APHA gives
          only a range instead (see Number note).
      number_note:
        type: text
        example: [null, null, null, Less than 5]
        description: What APHA gives instead of a number, as it doesn't give small numbers, e.g. Less than 5
      density:
        type: double
        example: [29.67, 41.4, 202.37, 0.0694]
        description: Number per square kilometre (100 ha), as APHA gives it. 0 where APHA gives none.
      density_rating:
        type: text
        example: [Low, Medium, Medium, Low]
        required: true
        description: Low, Medium or High, from the density (the bands for each kind of livestock are on the admin page)

  livestock_pressure:
    title: Livestock Pressure
    description: >-
      The nitrogen and phosphate from each catchment's livestock (estimated
      from their densities), and the pressure that puts on the river: the
      Livestock risk tile.
    filled_by: input
    input: apha_livestock
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014340, GB108050013950, GB108050008080]
        primary_key: true
        references: catchments.id
      nitrogen_load:
        type: double
        example: [11877.59, 18086.25, 11376.2, 7078.46]
        required: true
        description: Nitrogen from livestock, in kg per year per square kilometre
      phosphate_load:
        type: double
        example: [3240.13, 5779.71, 3921.91, 1405.88]
        required: true
        description: Phosphate from livestock, in kg per year per square kilometre
      nitrogen_and_phosphate_load:
        type: double
        example: [15117.73, 23865.96, 15298.11, 8484.34]
        required: true
        description: The two added up, in kg per year per square kilometre
      pressure:
        type: text
        example: [Medium, High, Medium, Low]
        required: true
        description: Very Low, Low, Medium, High or Very High, from the nitrogen and phosphate load

  phosphate_sources:
    title: Phosphate Sources
    description: >-
      Where each catchment's phosphate comes from (estimated by the EA's SAGIS
      model), as a percentage per source, at the end of AMP7 (2025) and AMP8
      (2030).
    filled_by: input
    input: sagis_phosphate
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      source:
        type: text
        example: [STW (SWW), Livestock, Arable, STW (Private)]
        primary_key: true
        description: e.g. Arable, CSOs (SWW), Highways, Industry, Livestock, STW (Private), STW (SWW), Urban
      year:
        type: integer
        example: [2025, 2025, 2025, 2025]
        primary_key: true
        description: The year the estimate is for, 2025 or 2030
      percent:
        type: double
        example: [60.89, 29.13, 5, 4.82]
        required: true
        description: The source's share of the catchment's phosphate, in %

  phosphate_point_diffuse:
    title: Phosphate Continuous and Diffuse
    description: >-
      The EA's split of each catchment's phosphate into Continuous (point
      sources, e.g. sewage works) and Diffuse, from SAGIS, at the end of AMP7
      (2025) and AMP8 (2030). It includes phosphate from upstream, so it isn't
      always the sources added up.
    filled_by: input
    input: sagis_phosphate
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050014460, GB108050014460]
        primary_key: true
        references: catchments.id
      source:
        type: text
        example: [Continuous, Diffuse, Continuous, Diffuse]
        primary_key: true
        description: Continuous or Diffuse
      year:
        type: integer
        example: [2025, 2025, 2030, 2030]
        primary_key: true
        description: The year the estimate is for, 2025 or 2030
      percent:
        type: double
        example: [61.05, 38.95, 61.05, 38.95]
        required: true
        description: Its share of the catchment's phosphate, in %

  sewerage_improvements:
    title: Sewerage Improvements
    description: >-
      The water company's planned improvements to its storm overflows, from
      Water UK's national plan: a row per overflow, named with Water UK's ID
      where a site has several.
    filled_by: input
    input: water_company_plans
    columns:
      catchment_id:
        type: text
        example: [GB108050014460, GB108050014460, GB108050008100, GB108050008100]
        primary_key: true
        references: catchments.id
      site_name:
        type: text
        example:
          - HIGH BICKINGTON STW
          - YARNSCOMBE SEWAGE TREATMENT WORKS
          - NORTH STREET CSO
          - OLD GATEWAY 1 COMBINED SEWER OF
        primary_key: true
      improvements:
        type: text
        example:
          - "Storage, New screen, Operational (e.g. blockages) …"
          - New screen. Other improvements to be confirmed
          - "Storage, New screen, Operational (e.g. blockages), Bespoke …"
          - "Storage, New screen, Operational (e.g. blockages) …"
      completion_year:
        type: integer
        example: [2035, 2040, 2040, 2040]
      predicted_spills_per_year:
        type: integer
        example: [10, 10, 9, 10]
        description: Predicted number of spills a year once the work is done

  # ---------------------------------------------------------------------------
  #  Intervention Management: the interventions needed across a location
  # ---------------------------------------------------------------------------

  intervention_types:
    title: Intervention Types
    description: >-
      Each type of intervention (e.g. Investment in STWs, Removing barriers),
      numbered as on the page: its line in the Intervention Summary, and its
      page in Interventions Detail (what it is, its progress, and its
      waterbodies from Intervention Waterbodies, in groups under headings).
      The summary's figures are as typed, so they can be rounded; its totals
      are added up from them. Text can have paragraphs, bullets, bold and
      links, written as described under Location Text.
    filled_by: excel
    columns:
      location_id:
        type: integer
        example: [1, 1, 1, 1]
        primary_key: true
        references: locations.id
        description: The location (see the Locations table), e.g. 1 for North Devon
      number:
        type: integer
        example: [1, 2, 3, 4]
        primary_key: true
        description: Its number on the page, e.g. 1 for "1. Investment in STWs (phosphate reduction)"
      name:
        type: text
        example:
          - Investment in STWs (phosphate reduction)
          - Investment in storm overflows (reduction in spills)
          - "Regulatory enforcement to drive compliance with Farming …"
          - Dairy/beef cattle slurry management support
        required: true
      button:
        type: text
        example:
          - Sewage treatment works investment
          - Storm overflow investment
          - Farming rules enforcement
          - Farm slurry management
        description: Its button in Interventions Detail, after its number (the name if empty)
      summary_group:
        type: text
        example:
          - Priority interventions (not in order of priority)
          - Priority interventions (not in order of priority)
          - Priority interventions (not in order of priority)
          - Priority interventions (not in order of priority)
        required: true
        description: >-
          The part of the Intervention Summary table it's in, by the part's
          heading, e.g. Secondary interventions. Each part ends with its total,
          and the parts are in the order of their lowest number.
      summary_rwbs:
        type: integer
        example: [40, 33, 48, 14]
        description: Intervention Summary, No. of RWBs (river water bodies)
      summary_cost:
        type: double
        example: [120000000, 231000000, 1300000, 7300000]
        description: Intervention Summary, Estimated Cost, in £ (e.g. 120000000 for £120m)
      percent_available:
        type: integer
        example: [100, 100, 100, 20]
        description: Intervention Summary, % Available (of the estimated cost); also used for the totals
      percent_delivered:
        type: integer
        example: [0, 0, null, 0]
        description: Intervention Summary, % Delivered. Empty shows "Data to follow".
      summary_lead:
        type: text
        example: [SWW, SWW, EA, "?"]
        description: Intervention Summary, Lead (short, e.g. SWW, EA or ?)
      description:
        type: text
        example:
          - "Reduce phosphorus and other pollutant discharges from …"
          - "Reduce the frequency and duration of storm overflow …"
          - "Environment Agency inspections, investigation and …"
          - "Support farms to improve slurry handling, storage …"
        description: Interventions Detail, Description
      lead_organisation:
        type: text
        example:
          - South West Water
          - South West Water
          - Environment Agency
          - "Farmers, advisers, Environment Agency, grant programmes and …"
        description: Interventions Detail, Lead delivery organisation
      river_water_bodies:
        type: text
        example: ["13 highest priority, 27 secondary priority", "33", "48 (21 priority, 27 secondary)", "14"]
        description: Interventions Detail, No. of river water bodies, as written
      estimated_cost:
        type: text
        example:
          - "£120m"
          - "£231 million"
          - "£1.3 million (equivalent to inspecting & engaging 645 farms)"
          - "£7.3 million"
        description: Interventions Detail, Estimated total cost, as written
      funding_available:
        type: text
        example:
          - "£120m (£42m already secured in AMP8 & AMP9)"
          - "£231 million"
          - "£1.3 million"
          - "£1.5 million"
        description: Interventions Detail, Funding available, as written
      funding_gap:
        type: text
        example: ["£0m", "£0", "£0", "£5.8 million"]
        description: Interventions Detail, Funding gap, as written
      funding_route:
        type: text
        example:
          - Water company investment (AMP programmes)
          - AMP 8-10
          - Included within existing statutory activity
          - Not yet clear
        description: Interventions Detail, Funding route / source
      ecological_benefit:
        type: text
        example:
          - "Reduce phosphorus loading from wastewater, improve …"
          - "Reduced wastewater pollution from storm overflow spills …"
          - "Reduced nutrient, sediment and faecal pollution from …"
          - "Reduce phosphorus losses from livestock farming and improve …"
        description: Interventions Detail, Ecological benefit
      cost_confidence:
        type: text
        example: ["Medium (£3m is a very broad average)", Medium, Medium-high, Low-medium]
        description: Interventions Detail, Confidence in costings
      progress:
        type: text
        example:
          - "- South West Water have plans to invest in sewage treatment …"
          - "- South West Water have plans invest in all storm overflows …"
          - "- The Environment Agency currently has 2 regulatory …"
          - "- There are generalist farm advisory programmes active …"
        description: Interventions Detail, under Progress
      groups:
        type: text
        example:
          - "Highest Priority, as Predominantly Waste Water Issue …"
          - "Priority Because of Impact on Shellfish Waters, Bathing …"
          - "Priority as Predominantly Agricultural Issue Secondary …"
          - Priority Farms Capital Improvements
        description: >-
          The headings its waterbodies are grouped under in Interventions
          Detail, one per line (Alt+Enter between them): the first is group 1,
          the next group 2, and so on (group_number in Intervention Waterbodies)

  intervention_waterbodies:
    title: Intervention Waterbodies
    description: >-
      Where each type of intervention is needed: one row per waterbody and
      intervention type. Update a row as funding is found and delivery starts
      and finishes.
    filled_by: excel
    columns:
      catchment_id:
        type: text
        example: [GB108050008080, GB108050008210, GB108050008110, GB108050008110]
        primary_key: true
        references: catchments.id
      intervention:
        type: integer
        example: [9, 9, 2, 3]
        primary_key: true
        description: The intervention type, by its number in Intervention Types
      group_number:
        type: integer
        example: [1, 1, 2, 1]
        required: true
        description: Which of the intervention type's groups it's listed in, e.g. 1 for the first heading in its groups
      note:
        type: text
        example: ["abandoned mine, natural mineralisation", "low flow, trade/industry discharge", null, null]
        description: Shown after the waterbody's name, e.g. what makes it a special case
      size:
        type: text
        example: [null, null, AMP9, c.20 priority farms]
        description: Size of Intervention, e.g. AMP8, c.6 priority farms or 2.4km (9.6km)
      estimated_cost:
        type: double
        example: [250000, 250000, 7000000, 40000]
        description: Estimated Cost, in £
      funding_available:
        type: double
        example: [0, 0, 7000000, 40000]
        description: Funding Available, in £. Empty shows nothing; 0 shows £0.
      started_delivery:
        type: text
        example: ["No", "No", "2030", "Yes"]
        description: Started Delivery, as written, e.g. 2025-2030, Yes or No
      finished_delivery:
        type: text
        example: ["No", "No", "2035", "No"]
