          - "- £1m for small project - £10m for large project - Average …"
          - "- 1 dedicated agricultural regulatory officer: £80,000 per …"
          - "- 1 dedicated farm adviser: £80,000 per year (fully loaded …"
        description: Shown under "Typical cost:", usually as bullets, ending with the average assumption used
      funding_route:
        type: text
        example:
